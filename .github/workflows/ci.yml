name: ClinicCare CI

on:
  push:
    branches: [ main, "feat/**", "fix/**", "wip/**" ]
  pull_request:
    branches: [ main, "feat/**" ]

jobs:
  backend:
    name: Backend Build & Test (.NET 10)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Your_password123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_password123!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Restore dependencies
        run: dotnet restore src/backend/ClinicManagement.sln

      - name: Build backend
        run: dotnet build src/backend/ClinicManagement.sln --no-restore --configuration Release

      - name: Validate Phase 4 independent dataset and benchmark
        shell: bash
        run: |
          dotnet run --project src/tools/ClinicManagement.AI.Training/ClinicManagement.AI.Training.csproj \
            --no-build --configuration Release -- --validate-phase4 \
            src/tools/ClinicManagement.AI.Training/data/phase4_independent_cases.json
          dotnet run --project src/tools/ClinicManagement.AI.Training/ClinicManagement.AI.Training.csproj \
            --no-build --configuration Release -- --phase4-self-test
          dotnet run --project src/tools/ClinicManagement.AI.Training/ClinicManagement.AI.Training.csproj \
            --no-build --configuration Release -- --benchmark-phase4 \
            src/tools/ClinicManagement.AI.Training/data/phase4_independent_cases.json \
            --report ./phase4-benchmark-report.json

      - name: Run Gate B registry, candidates, and fail-closed promotion decision
        shell: bash
        run: |
          dotnet run --project src/tools/ClinicManagement.AI.Training/ClinicManagement.AI.Training.csproj \
            --no-build --configuration Release -- --gateb \
            --report ./gateb-model-report.json \
            --promotion ./gateb-promotion-decision.json
          test -f ./gateb-model-report.json
          test -f ./gateb-promotion-decision.json
          python3 - <<'PY'
          import json
          report = json.load(open("gateb-model-report.json", encoding="utf-8"))
          decision = json.load(open("gateb-promotion-decision.json", encoding="utf-8"))
          assert report["Registry"]["IsValid"] is True
          assert report["SelectionUsesBlindHoldout"] is False
          assert report["BlindEvaluationWasAfterSelection"] is True
          assert decision["Decision"] != "PROMOTED_TO_SHADOW", "CI must not auto-promote an artifact"
          for candidate in report["Candidates"]:
              if candidate["Status"] == "completed":
                  assert candidate["ArtifactSha256"]
                  assert candidate["Deterministic"] in (True, False)
          print("Gate B registry/candidate/promotion checks passed; no artifact was promoted.")
          PY
          rm -f ./gateb-model-report.json ./gateb-promotion-decision.json

      - name: Run focused Gate B registry and promotion tests
        run: >-
          dotnet test src/backend/ClinicManagement.IntegrationTests/ClinicManagement.IntegrationTests.csproj
          --no-build --configuration Release --filter "FullyQualifiedName~GateBModelPipelineTests"

      - name: Check for pending EF Core model changes
        run: dotnet ef migrations has-pending-model-changes --project src/backend/ClinicManagement.Infrastructure --startup-project src/backend/ClinicManagement.Api

      - name: Run focused Phase 1.2 contract tests
        run: >-
          dotnet test src/backend/ClinicManagement.IntegrationTests/ClinicManagement.IntegrationTests.csproj
          --no-build --configuration Release --filter
          "FullyQualifiedName~AiPhase12ContractTests|FullyQualifiedName~AiSessionCleanupWorkerTests"
          --logger "trx;LogFileName=phase12.trx"

      - name: Surface focused Phase 1.2 test failures
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          namespace = {"trx": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for path in glob.glob("**/TestResults/phase12.trx", recursive=True):
              root = ET.parse(path).getroot()
              for result in root.findall(".//trx:UnitTestResult[@outcome='Failed']", namespace):
                  name = result.attrib.get("testName", "unknown test")
                  message = result.findtext(".//trx:Message", default="No failure message", namespaces=namespace)
                  print(f"::error title={name}::{message.replace(chr(10), ' ')[:1500]}")
          PY

      - name: Run focused Phase 2 copilot tests
        run: >-
          dotnet test src/backend/ClinicManagement.IntegrationTests/ClinicManagement.IntegrationTests.csproj
          --no-build --configuration Release --filter
          "FullyQualifiedName~AiPhase2ConversationIntelligenceTests|FullyQualifiedName~AiPhase2RoleCopilotIntegrationTests|FullyQualifiedName~AiPhase2RoleActionGatewayTests"

      - name: Run deterministic Gate D provider, config, degraded, and cross-actor tests
        run: >-
          dotnet test src/backend/ClinicManagement.IntegrationTests/ClinicManagement.IntegrationTests.csproj
          --no-build --configuration Release --filter
          "FullyQualifiedName~GeminiAiProviderResilienceTests|FullyQualifiedName~AiProviderConfigurationInspectorTests|FullyQualifiedName~AiPhase32ReadAccessTests|FullyQualifiedName~AiPhase2RoleActionGatewayTests"

      - name: Generate official idempotent migration script
        shell: bash
        run: |
          dotnet ef migrations script --idempotent --context AppDbContext \
            --project src/backend/ClinicManagement.Infrastructure \
            --startup-project src/backend/ClinicManagement.Api \
            --configuration Release --output ./ai-ef-idempotent.sql
          grep -q "20260926114519_HardenAiPendingToolActionExecution" ./ai-ef-idempotent.sql
          grep -q "20260927013919_AddAiRoleConfirmedActionGateway" ./ai-ef-idempotent.sql
          grep -q "20260927023122_AddAppointmentFacilityBinding" ./ai-ef-idempotent.sql
          grep -q "__EFMigrationsHistory" ./ai-ef-idempotent.sql

      - name: Prepare SQL Server migration database
        shell: bash
        run: |
          docker ps --format 'table {{.ID}}\t{{.Image}}\t{{.Names}}'
          SQLSERVER_CONTAINER="$(docker ps --format '{{.ID}} {{.Image}} {{.Names}}' | awk 'tolower($2) ~ /mssql\/server/ { print $1; exit }')"
          test -n "$SQLSERVER_CONTAINER"
          echo "Using SQL Server service container $SQLSERVER_CONTAINER"
          echo "SQLSERVER_CONTAINER=$SQLSERVER_CONTAINER" >> "$GITHUB_ENV"
          docker exec "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P 'Your_password123!' -C -b -Q "SELECT 1"
          docker exec "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P 'Your_password123!' -C -b \
            -Q "IF DB_ID('ClinicManagement_CiMigration') IS NULL EXEC(N'CREATE DATABASE [ClinicManagement_CiMigration]');"
          for attempt in {1..30}; do
            database_state="$(docker exec "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P 'Your_password123!' -C -h -1 -W -b -Q "SET NOCOUNT ON; SELECT state_desc FROM sys.databases WHERE name = 'ClinicManagement_CiMigration';" | tr -d '\r' | xargs)"
            if [[ "$database_state" == "ONLINE" ]]; then
              break
            fi
            sleep 2
          done
          test "$database_state" = "ONLINE"

      - name: Apply official migration script to SQL Server
        shell: bash
        run: |
          printf '%s\n' \
            'SET ANSI_NULLS ON;' \
            'SET QUOTED_IDENTIFIER ON;' \
            'SET ANSI_PADDING ON;' \
            'SET ANSI_WARNINGS ON;' \
            'SET ARITHABORT ON;' \
            'SET CONCAT_NULL_YIELDS_NULL ON;' \
            'SET NUMERIC_ROUNDABORT OFF;' \
            'GO' \
            ':r /tmp/ai-ef-idempotent.sql' > ./ai-ef-apply.sql
          docker cp ./ai-ef-idempotent.sql "$SQLSERVER_CONTAINER:/tmp/ai-ef-idempotent.sql"
          docker cp ./ai-ef-apply.sql "$SQLSERVER_CONTAINER:/tmp/ai-ef-apply.sql"
          if ! migration_output="$(docker exec "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P 'Your_password123!' -C \
            -d ClinicManagement_CiMigration -b -i /tmp/ai-ef-apply.sql 2>&1)"; then
            printf '%s\n' "$migration_output"
            printf '::error title=SQL Server migration apply failed::%s\n' \
              "$(printf '%s' "$migration_output" | tr '\r\n' ' ' | cut -c1-1500)"
            exit 1
          fi

      - name: Reapply official migration script for idempotence
        shell: bash
        run: |
          docker exec "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P 'Your_password123!' -C \
            -d ClinicManagement_CiMigration -b -i /tmp/ai-ef-apply.sql

      - name: Verify SQL Server migration schema and history
        shell: bash
        run: |
          docker exec "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P 'Your_password123!' -C \
            -d ClinicManagement_CiMigration -b -Q "IF NOT EXISTS (SELECT 1 FROM sys.tables WHERE name = 'AiPendingToolActions') THROW 50000, 'AiPendingToolActions table missing', 1; IF COL_LENGTH('AiPendingToolActions', 'ActorRole') IS NULL OR COL_LENGTH('AiPendingToolActions', 'ConfirmationTokenHash') IS NULL OR COL_LENGTH('AiPendingToolActions', 'SourceAiActionId') IS NULL THROW 50000, 'Role action columns missing', 1; IF COL_LENGTH('DiagnosticOrders', 'SourceAiActionId') IS NULL THROW 50000, 'Diagnostic order AI source column missing', 1; IF COL_LENGTH('Appointments', 'FacilityId') IS NULL THROW 50000, 'Appointment facility binding column missing', 1; IF NOT EXISTS (SELECT 1 FROM sys.indexes WHERE name = 'IX_AiPendingToolActions_UserId_ResourceType_ResourceId') THROW 50000, 'Active action index missing', 1; IF NOT EXISTS (SELECT 1 FROM sys.indexes WHERE name = 'IX_AiPendingToolActions_SourceAiActionId') THROW 50000, 'AI action source index missing', 1; IF NOT EXISTS (SELECT 1 FROM sys.indexes WHERE name = 'IX_DiagnosticOrders_SourceAiActionId') THROW 50000, 'Diagnostic AI source index missing', 1; IF NOT EXISTS (SELECT 1 FROM sys.indexes WHERE name = 'IX_Appointments_FacilityId_AppointmentDate') THROW 50000, 'Appointment facility index missing', 1; IF NOT EXISTS (SELECT 1 FROM __EFMigrationsHistory WHERE MigrationId = '20260926114519_HardenAiPendingToolActionExecution') THROW 50000, 'Hardening migration history missing', 1; IF NOT EXISTS (SELECT 1 FROM __EFMigrationsHistory WHERE MigrationId = '20260927013919_AddAiRoleConfirmedActionGateway') THROW 50000, 'Role action migration history missing', 1; IF NOT EXISTS (SELECT 1 FROM __EFMigrationsHistory WHERE MigrationId = '20260927023122_AddAppointmentFacilityBinding') THROW 50000, 'Appointment facility migration history missing', 1;"
          rm -f ./ai-ef-idempotent.sql ./ai-ef-apply.sql

      - name: Run backend tests
        env:
          TEST_SQLSERVER_CONNECTION_STRING: "Server=localhost,1433;Database=ClinicManagement_CiTest;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;Connect Timeout=30;"
        run: dotnet test src/backend/ClinicManagement.sln --no-build --configuration Release --verbosity normal

      - name: Publish API and verify AI model artifacts
        run: |
          dotnet publish src/backend/ClinicManagement.Api/ClinicManagement.Api.csproj --no-restore --configuration Release -o ./publish_ci_verify
          test -f ./publish_ci_verify/models/vietnamese_intent_classifier_v1.zip
          test -f ./publish_ci_verify/models/intent_model_metadata.json
          rm -rf ./publish_ci_verify

  frontend:
    name: Frontend Lint, Test & Build (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run linter
        working-directory: src/frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: src/frontend
        run: npm run test

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
