name: ClinicCare CI

on:
  push:
    branches: [ main, "feat/**", "fix/**", "wip/**" ]
  pull_request:
    branches: [ main, "feat/**" ]

jobs:
  backend:
    name: Backend Build & Test (.NET 10)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Your_password123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_password123!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Restore dependencies
        run: dotnet restore src/backend/ClinicManagement.sln

      - name: Build backend
        run: dotnet build src/backend/ClinicManagement.sln --no-restore --configuration Release

      - name: Check for pending EF Core model changes
        run: dotnet ef migrations has-pending-model-changes --project src/backend/ClinicManagement.Infrastructure --startup-project src/backend/ClinicManagement.Api

      - name: Diagnose confirmation concurrency contracts
        id: diagnose_confirmation_concurrency
        continue-on-error: true
        run: >-
          dotnet test src/backend/ClinicManagement.IntegrationTests/ClinicManagement.IntegrationTests.csproj
          --no-build --configuration Release --filter
          "FullyQualifiedName~AiPhase12ContractTests.Concurrent_confirmation_claims_one_lease_and_creates_one_change_request|FullyQualifiedName~AiPhase12ContractTests.Confirmation_rejects_an_active_lease_and_reclaims_an_expired_lease_once"

      - name: Diagnose confirmation validation contracts
        id: diagnose_confirmation_validation
        continue-on-error: true
        run: >-
          dotnet test src/backend/ClinicManagement.IntegrationTests/ClinicManagement.IntegrationTests.csproj
          --no-build --configuration Release --filter
          "FullyQualifiedName~AiPhase12ContractTests.Dedicated_confirmation_rejects_expired_and_cancelled_actions_without_side_effects|FullyQualifiedName~AiPhase12ContractTests.Failed_retryable_action_can_retry_and_complete|FullyQualifiedName~AiPhase12ContractTests.Corrupt_persisted_arguments_fail_closed_and_become_terminal"

      - name: Diagnose execution revalidation contracts
        id: diagnose_execution_revalidation
        continue-on-error: true
        run: >-
          dotnet test src/backend/ClinicManagement.IntegrationTests/ClinicManagement.IntegrationTests.csproj
          --no-build --configuration Release --filter
          "FullyQualifiedName~AiPhase12ContractTests.Confirmation_revalidates_ownership_and_all_token_binding_fields_at_execution_time|FullyQualifiedName~AiPhase12ContractTests.Reschedule_confirmation_revalidates_changed_slot_doctor_schedule_leave_and_conflict"

      - name: Diagnose idempotency planner contracts
        id: diagnose_idempotency_planner
        continue-on-error: true
        run: >-
          dotnet test src/backend/ClinicManagement.IntegrationTests/ClinicManagement.IntegrationTests.csproj
          --no-build --configuration Release --filter
          "FullyQualifiedName~AiPhase12ContractTests.Crash_window_with_existing_source_record_completes_without_duplicate_change_request|FullyQualifiedName~AiPhase12ContractTests.Planner_rejects_mixed_or_unknown_write_plan_before_first_read_handler"

      - name: Diagnose remaining Phase 1.2 contracts
        id: diagnose_remaining_contracts
        continue-on-error: true
        run: >-
          dotnet test src/backend/ClinicManagement.IntegrationTests/ClinicManagement.IntegrationTests.csproj
          --no-build --configuration Release --filter
          "FullyQualifiedName~AiPhase12ContractTests"

      - name: Diagnose session cleanup contracts
        id: diagnose_session_cleanup
        continue-on-error: true
        run: >-
          dotnet test src/backend/ClinicManagement.IntegrationTests/ClinicManagement.IntegrationTests.csproj
          --no-build --configuration Release --filter
          "FullyQualifiedName~AiSessionCleanupWorkerTests"

      - name: Fail if any focused diagnostic group failed
        if: always()
        shell: bash
        run: |
          failed=0
          for outcome in \
            "${{ steps.diagnose_confirmation_concurrency.outcome }}" \
            "${{ steps.diagnose_confirmation_validation.outcome }}" \
            "${{ steps.diagnose_execution_revalidation.outcome }}" \
            "${{ steps.diagnose_idempotency_planner.outcome }}" \
            "${{ steps.diagnose_remaining_contracts.outcome }}" \
            "${{ steps.diagnose_session_cleanup.outcome }}"; do
            if [[ "$outcome" != "success" ]]; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Generate and validate official idempotent migration script
        shell: bash
        run: |
          dotnet ef migrations script --idempotent --context AppDbContext \
            --project src/backend/ClinicManagement.Infrastructure \
            --startup-project src/backend/ClinicManagement.Api \
            --configuration Release --output ./phase12-ef-idempotent.sql
          grep -q "20260926114519_HardenAiPendingToolActionExecution" ./phase12-ef-idempotent.sql
          grep -q "__EFMigrationsHistory" ./phase12-ef-idempotent.sql
          docker ps --format 'table {{.ID}}\t{{.Image}}\t{{.Names}}'
          SQLSERVER_CONTAINER="$(docker ps --format '{{.ID}} {{.Image}} {{.Names}}' | awk 'tolower($2) ~ /mssql\/server/ { print $1; exit }')"
          test -n "$SQLSERVER_CONTAINER"
          echo "Using SQL Server service container $SQLSERVER_CONTAINER"
          docker exec "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P 'Your_password123!' -C \
            -Q "SELECT 1; IF DB_ID('ClinicManagement_CiMigration') IS NULL CREATE DATABASE [ClinicManagement_CiMigration];"
          docker cp ./phase12-ef-idempotent.sql "$SQLSERVER_CONTAINER:/tmp/phase12-ef-idempotent.sql"
          docker exec "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P 'Your_password123!' -C \
            -d ClinicManagement_CiMigration -b -i /tmp/phase12-ef-idempotent.sql
          docker exec "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P 'Your_password123!' -C \
            -d ClinicManagement_CiMigration -b -i /tmp/phase12-ef-idempotent.sql
          docker exec "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P 'Your_password123!' -C \
            -d ClinicManagement_CiMigration -b -Q "IF NOT EXISTS (SELECT 1 FROM sys.tables WHERE name = 'AiPendingToolActions') THROW 50000, 'AiPendingToolActions table missing', 1; IF NOT EXISTS (SELECT 1 FROM sys.indexes WHERE name = 'IX_AiPendingToolActions_UserId_ResourceType_ResourceId') THROW 50000, 'Active action index missing', 1; IF NOT EXISTS (SELECT 1 FROM __EFMigrationsHistory WHERE MigrationId = '20260926114519_HardenAiPendingToolActionExecution') THROW 50000, 'Hardening migration history missing', 1;"
          rm -f ./phase12-ef-idempotent.sql

      - name: Run backend tests
        env:
          TEST_SQLSERVER_CONNECTION_STRING: "Server=localhost,1433;Database=ClinicManagement_CiTest;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;Connect Timeout=30;"
        run: dotnet test src/backend/ClinicManagement.sln --no-build --configuration Release --verbosity normal

      - name: Publish API and verify AI model artifacts
        run: |
          dotnet publish src/backend/ClinicManagement.Api/ClinicManagement.Api.csproj --no-restore --configuration Release -o ./publish_ci_verify
          test -f ./publish_ci_verify/models/vietnamese_intent_classifier_v1.zip
          test -f ./publish_ci_verify/models/intent_model_metadata.json
          rm -rf ./publish_ci_verify

  frontend:
    name: Frontend Lint, Test & Build (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run linter
        working-directory: src/frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: src/frontend
        run: npm run test

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
