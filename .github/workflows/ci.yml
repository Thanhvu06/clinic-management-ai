name: ClinicCare CI

on:
  push:
    branches: [ main, "feat/**", "fix/**", "wip/**" ]
  pull_request:
    branches: [ main, "feat/**" ]

jobs:
  backend:
    name: Backend Build & Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/backend/ClinicManagement.sln

      - name: Build backend
        run: dotnet build src/backend/ClinicManagement.sln --no-restore --configuration Release

      - name: Run backend tests
        run: dotnet test src/backend/ClinicManagement.sln --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend Lint, Test & Build (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run linter
        working-directory: src/frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: src/frontend
        run: npm run test

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
